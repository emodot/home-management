name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Generated email templates are up to date
        run: |
          pnpm --filter @home/emails build
          git diff --exit-code -- packages/emails/generated

      - name: Edge functions (deno check, lint, test)
        run: pnpm functions

      - run: pnpm build
        env:
          # Placeholder public values; the build doesn't contact Supabase.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres only and applies supabase/migrations + seed.sql.
      - run: supabase db start

      - run: supabase db lint --level error

      # pgTAP tests in supabase/tests (RLS and database behaviour).
      - run: supabase test db

  e2e:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local stack
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor

      - name: Serve edge functions
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &

      - name: Seed a super-admin
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=API_URL \
            --override-name auth.service_role_key=SERVICE_ROLE_KEY | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          curl -sf -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"email":"superadmin@example.com","password":"super-admin-e2e","email_confirm":true}' > /dev/null
          docker exec supabase_db_home-management psql -U postgres -v ON_ERROR_STOP=1 -c \
            "insert into public.app_admins (user_id) select id from auth.users where email = 'superadmin@example.com'"

      - name: Point the app at the local stack
        run: |
          supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY | grep '^VITE_' > apps/web/.env

      - run: pnpm --filter @home/web exec playwright install --with-deps chromium

      - run: pnpm --filter @home/web e2e
        env:
          E2E_ADMIN_EMAIL: superadmin@example.com
          E2E_ADMIN_PASSWORD: super-admin-e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            functions.log
